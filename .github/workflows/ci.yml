# The CI of this repository: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template,
# its CI.md). The job runs each standard script that package.json has (format:check, typecheck, lint,
# test, build and lint:ste) on Node.js 26.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:
  # A person starts a run on a branch with no pull request: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@d20d75b11120af71eaf6d2f59385c9cd053fff8b # main
